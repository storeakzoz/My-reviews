<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKZOZ STORE - آراء العملاء والتقييمات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.1.4/swiper-bundle.min.css">
<style>
  :root {
    --brand: #4E9FE5;
    --brand-dark: #2563EB;
    --brand-light: #EFF6FF;
    --brand-border: #BFDBFE;
    --card-bg: #FFFFFF;
    --text-dark: #0F172A;
    --text-body: #334155;
    --text-muted: #64748B;
    --border: #E2E8F0;
    --shadow-subtle: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
  }

  * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
  body { background-color: #F8FAFC; color: var(--text-body); margin: 0; padding: 0; direction: rtl; }

  .page-wrap { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem 4rem; }
  .store-brand-title { font-size: 1.2rem; font-weight: 900; color: var(--brand-dark); letter-spacing: 1px; margin-bottom: 0.5rem; }
  
  .trust-header { text-align: center; margin-bottom: 2rem; }
  .trust-header .rating-badge {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: #FFFFFF; padding: 0.4rem 1.2rem; border-radius: 999px;
    box-shadow: var(--shadow-subtle); border: 1px solid var(--border); margin-bottom: 1rem;
  }
  .trust-header h1 { font-size: 1.8rem; font-weight: 800; margin: 0 0 0.5rem; color: var(--text-dark); }
  .trust-header .subtext { color: var(--text-muted); font-size: 0.95rem; margin: 0; }
  
  .section-cta { display: flex; justify-content: center; margin-bottom: 2.5rem; }
  
  .carousel-container { position: relative; padding: 0 1rem; }
  .review-swiper { padding: 1rem 0.5rem 3.5rem; }
  
  .review-card {
    background: var(--card-bg); border-radius: var(--radius-xl); box-shadow: var(--shadow-subtle);
    padding: 1.5rem; height: 100%; display: flex; flex-direction: column; gap: 0.8rem;
    border: 1px solid var(--border); transition: transform 0.25s ease;
  }
  .review-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: var(--brand-border); }
  .review-card .card-head { display: flex; align-items: center; gap: 0.8rem; }
  .review-card .avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid var(--brand-light); background: #F1F5F9; }
  .review-card .who { display: flex; flex-direction: column; gap: 0.25rem; }
  .review-card .who .name { font-weight: 800; font-size: 0.98rem; }
  .review-card .stars-row { display: flex; gap: 0.15rem; }
  .review-card .title { font-weight: 800; font-size: 1.05rem; color: var(--text-dark); }
  .review-card .body { color: var(--text-body); font-size: 0.92rem; line-height: 1.75; flex: 1; }
  .review-card .footer { color: var(--text-muted); font-size: 0.8rem; border-top: 1px solid var(--border); padding-top: 0.8rem; }

  .verified-badge {
    display: inline-flex; align-items: center; gap: 0.2rem; font-size: 0.75rem;
    color: #059669; background: #ECFDF5; padding: 0.15rem 0.4rem; border-radius: 4px; font-weight: 700;
  }
  .admin-badge {
    display: inline-flex; align-items: center; background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #ffffff; font-size: 0.65rem; font-weight: 800; padding: 0.15rem 0.45rem; border-radius: 4px; margin-right: 0.4rem;
  }

  .replies-list { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem; max-height: 200px; overflow-y: auto; }
  .reply-item { padding: 0.6rem 0.8rem; border-radius: var(--radius-md); font-size: 0.85rem; }
  .reply-item.admin-type { background: var(--brand-light); border-right: 3px solid var(--brand-dark); }
  .reply-header { display: flex; align-items: center; gap: 0.4rem; font-weight: 700; margin-bottom: 0.2rem; font-size: 0.8rem; }
  .reply-header img { width: 20px; height: 20px; border-radius: 50%; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.75rem 1.5rem; font-weight: 700; border-radius: var(--radius-lg); border: none; cursor: pointer; font-size: 0.95rem; }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-ghost { background: transparent; color: var(--text-muted); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; }
  .modal-overlay.show { display: flex; }
  .modal-box { background: #fff; border-radius: var(--radius-xl); width: 100%; max-width: 480px; padding: 1.75rem; }
  .field { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
  .field label { font-size: 0.85rem; font-weight: 700; }
  .field input, .field textarea { padding: 0.65rem; border: 1px solid var(--border); border-radius: var(--radius-md); outline: none; }

  .swiper-button-next, .swiper-button-prev { color: var(--brand) !important; background: #FFFFFF !important; width: 40px !important; height: 40px !important; border-radius: 50% !important; box-shadow: var(--shadow-subtle) !important; border: 1px solid var(--border) !important; }
  .swiper-button-next::after, .swiper-button-prev::after { font-size: 14px !important; font-weight: 900 !important; }

  /* ضبط حجم شعار Trustpilot */
  .trustpilot-footer { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 3rem; }
  .trustpilot-label { font-size: 0.85rem; color: var(--text-muted); }
  .trustpilot-logo { height: 24px; width: auto; max-width: 120px; }

  @media (max-width: 768px) {
    .swiper-button-next, .swiper-button-prev { display: none !important; }
  }
</style>
</head>
<body>

<div class="page-wrap">
  <header class="trust-header">
    <div class="store-brand-title">AKZOZ STORE</div>
    <div class="rating-badge">
      <div id="headerStars" style="display:flex;gap:2px;"></div>
      <span style="font-weight:800;font-size:0.9rem;" id="avgBadge">4.9 من 5</span>
    </div>
    <h1 id="avgRatingText">تقييمات وأراء العملاء</h1>
    <p class="subtext" id="reviewCountText">بناءً على التقييمات الموثقة</p>
  </header>

  <div class="section-cta">
    <button class="btn btn-primary" id="openModalBtn">اكتب تقييمك الآن</button>
  </div>

  <div class="carousel-container">
    <div class="swiper review-swiper" id="reviewSwiper">
      <div class="swiper-wrapper" id="swiperWrapper"></div>
      <div class="swiper-pagination"></div>
    </div>
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
  </div>

  <footer class="trustpilot-footer">
    <span class="trustpilot-label">موثوق بواسطة</span>
    <svg class="trustpilot-logo" viewBox="0 0 230 52" fill="none">
      <path d="M0 16.5H16.2L21.2 0L26.2 16.5H42.4L28.7 26.5L33.9 43L21.2 33L8.5 43L13.7 26.5L0 16.5Z" fill="#00B67A"/>
      <path d="M21.2 0L26.2 16.5H42.4L28.7 26.5L33.9 43L21.2 33V0Z" fill="#005128"/>
      <text x="50" y="36" font-family="'Cairo', sans-serif" font-weight="800" font-size="30" fill="#0F172A">Trustpilot</text>
    </svg>
  </footer>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h2 style="margin:0 0 1.2rem;font-size:1.3rem;font-weight:800;">إضافة تقييم جديد</h2>
    <form id="reviewForm">
      <div class="field">
        <label for="fName">الاسم الكامل</label>
        <input type="text" id="fName" required>
      </div>
      <div class="field">
        <label for="fTitle">عنوان التقييم</label>
        <input type="text" id="fTitle" required>
      </div>
      <div class="field">
        <label for="fBody">تفاصيل التقييم</label>
        <textarea id="fBody" required></textarea>
      </div>
      <div style="display:flex;gap:0.75rem;margin-top:1.5rem;">
        <button type="submit" class="btn btn-primary" style="flex:1;">إرسال التقييم</button>
        <button type="button" class="btn btn-ghost" id="closeModalBtn">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<script src="common-v1.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.1.4/swiper-bundle.min.js"></script>
<script>
  let swiperInstance = null;

  function renderHeader() {
    const reviews = getReviews();
    const avg = computeAverage(reviews);
    document.getElementById('avgBadge').textContent = `${avg} من 5`;
    document.getElementById('reviewCountText').textContent = `بناءً على ${reviews.length} رأياً للعملاء المعتمدين`;
    document.getElementById('headerStars').innerHTML = starsSVG(Math.round(Number(avg)), 18);
  }

  function renderCarousel() {
    const reviews = getReviews();
    const wrapper = document.getElementById('swiperWrapper');
    
    wrapper.innerHTML = reviews.map(r => {
      const adminReplies = (r.replies || []).filter(rp => rp.isAdmin);
      return `
      <div class="swiper-slide">
        <div class="review-card">
          <div class="card-head">
            <img class="avatar" src="${escapeHTML(r.avatar || DEFAULT_AVATAR)}" alt="">
            <div class="who">
              <span class="name">${escapeHTML(r.name)}</span>
              ${r.is_verified ? checkmarkBadge() : ''}
            </div>
          </div>
          <div class="stars-row">${starsSVG(r.stars, 16)}</div>
          <div class="title">${escapeHTML(r.title)}</div>
          <div class="body">${escapeHTML(r.body)}</div>
          <div class="replies-list">
            ${adminReplies.map(rp => `
              <div class="reply-item admin-type">
                <div class="reply-header">
                  <span>${escapeHTML(rp.name)}</span>
                  <span class="admin-badge">ADMIN</span>
                </div>
                <div>${escapeHTML(rp.text)}</div>
              </div>
            `).join('')}
          </div>
          <div class="footer">${escapeHTML(r.date)}</div>
        </div>
      </div>
    `}).join('');

    if (swiperInstance) swiperInstance.destroy(true, true);
    
    swiperInstance = new Swiper('.review-swiper', {
      slidesPerView: 1,
      spaceBetween: 16,
      pagination: { el: '.swiper-pagination', clickable: true },
      navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
      breakpoints: {
        640: { slidesPerView: 2, spaceBetween: 20 },
        1024: { slidesPerView: 3, spaceBetween: 24 }
      }
    });
  }

  document.getElementById('openModalBtn').addEventListener('click', () => {
    document.getElementById('modalOverlay').classList.add('show');
  });

  document.getElementById('closeModalBtn').addEventListener('click', () => {
    document.getElementById('modalOverlay').classList.remove('show');
  });

  renderHeader();
  renderCarousel();
</script>
</body>
</html>
