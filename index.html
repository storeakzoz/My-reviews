<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKZOZ STORE - آراء العملاء والتقييمات</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.1.4/swiper-bundle.min.css">
<style>
  .page-wrap { max-width: 1200px; margin: 0 auto; padding: 3.5rem 1.5rem 5rem; }
  .trust-header { text-align: center; margin-bottom: 2.5rem; }
  .trust-header .rating-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: #FFFFFF;
    padding: 0.4rem 1.2rem;
    border-radius: 999px;
    box-shadow: var(--shadow-subtle);
    border: 1px solid var(--border);
    margin-bottom: 1rem;
  }
  .trust-header h1 { font-size: 1.8rem; font-weight: 800; margin: 0 0 0.5rem; color: var(--text-dark); }
  .trust-header .subtext { color: var(--text-muted); font-size: 0.95rem; margin: 0; }
  .section-cta { display: flex; justify-content: center; margin-bottom: 3rem; }
  .carousel-container { position: relative; padding: 0 2.5rem; }
  .review-swiper { padding: 1rem 0.5rem 3.5rem; }
  .swiper-slide { height: auto !important; }
  .review-card {
    background: var(--card-bg);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-subtle);
    padding: 1.75rem;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
    border: 1px solid var(--border);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .review-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: var(--brand-border); }
  .review-card .card-head { display: flex; align-items: center; gap: 0.8rem; }
  .review-card .avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--brand-light); }
  .review-card .who { display: flex; flex-direction: column; gap: 0.25rem; }
  .review-card .who .name { font-weight: 800; font-size: 0.98rem; }
  .review-card .stars-row { display: flex; gap: 0.15rem; }
  .review-card .title { font-weight: 800; font-size: 1.05rem; color: var(--text-dark); }
  .review-card .body { color: var(--text-body); font-size: 0.92rem; line-height: 1.75; flex: 1; }
  .review-card .footer { color: var(--text-muted); font-size: 0.8rem; border-top: 1px solid var(--border); padding-top: 0.8rem; }
  
  .swiper-button-next, .swiper-button-prev {
    color: var(--brand) !important;
    background: #FFFFFF !important;
    width: 44px !important;
    height: 44px !important;
    border-radius: 50% !important;
    box-shadow: var(--shadow-subtle) !important;
    border: 1px solid var(--border) !important;
  }
  .swiper-button-next::after, .swiper-button-prev::after { font-size: 15px !important; font-weight: 900 !important; }
  .swiper-pagination-bullet-active { background: var(--brand) !important; width: 22px !important; border-radius: 999px !important; }
</style>
</head>
<body>

<div class="page-wrap">

  <header class="trust-header">
    <div class="store-brand-title">AKZOZ STORE</div>
    <div class="rating-badge">
      <div id="headerStars" style="display:flex;gap:2px;"></div>
      <span style="font-weight:800;font-size:0.9rem;" id="avgBadge">4.9 من 5</span>
    </div>
    <h1 id="avgRatingText">تقييمات وأراء العملاء</h1>
    <p class="subtext" id="reviewCountText">بناءً على التقييمات الموثقة</p>
  </header>

  <div class="section-cta">
    <button class="btn btn-primary" id="openModalBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 5v14M5 12h14" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      اكتب تقييمك الآن
    </button>
  </div>

  <div class="carousel-container">
    <div class="swiper review-swiper" id="reviewSwiper">
      <div class="swiper-wrapper" id="swiperWrapper"></div>
      <div class="swiper-pagination"></div>
    </div>
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
  </div>

  <footer class="trustpilot-footer">
    <span class="trustpilot-label">موثوق بواسطة</span>
    <a href="https://www.trustpilot.com/review/yourdomain.com" target="_blank" rel="noopener noreferrer" class="trustpilot-link" title="Trustpilot">
      <svg class="trustpilot-logo" viewBox="0 0 230 52" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 16.5H16.2L21.2 0L26.2 16.5H42.4L28.7 26.5L33.9 43L21.2 33L8.5 43L13.7 26.5L0 16.5Z" fill="#00B67A"/>
        <path d="M21.2 0L26.2 16.5H42.4L28.7 26.5L33.9 43L21.2 33V0Z" fill="#005128"/>
        <text x="50" y="36" font-family="'Cairo', sans-serif" font-weight="800" font-size="30" fill="#0F172A">Trustpilot</text>
      </svg>
    </a>
  </footer>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h2 style="margin:0 0 1.2rem;font-size:1.3rem;font-weight:800;">إضافة تقييم جديد</h2>
    <form id="reviewForm">
      <div class="field">
        <label for="fName">الاسم الكامل</label>
        <input type="text" id="fName" required placeholder="مثال: عبدالله الغامدي">
      </div>
      <div class="field">
        <label>التقييم بالنجوم</label>
        <div class="star-picker" id="starPicker"></div>
      </div>
      <div class="field">
        <label for="fTitle">عنوان التقييم</label>
        <input type="text" id="fTitle" required placeholder="عنوان يختصر تجربتك">
      </div>
      <div class="field">
        <label for="fBody">تفاصيل التقييم</label>
        <textarea id="fBody" required placeholder="اكتب رأيك بالتفصيل هنا..."></textarea>
      </div>
      <div style="display:flex;gap:0.75rem;margin-top:1.5rem;">
        <button type="submit" class="btn btn-primary" style="flex:1;">إرسال التقييم</button>
        <button type="button" class="btn btn-ghost" id="closeModalBtn">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="12" cy="12" r="10" fill="#4E9FE5"/>
    <path d="M8 12l3 3 5-5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <span id="toastMessage">شكراً لك! تم استلام تقييمك بنجاح.</span>
</div>

<script src="common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.1.4/swiper-bundle.min.js"></script>
<script>
  let selectedStars = 5;
  let swiperInstance = null;

  function renderHeader() {
    const reviews = getReviews();
    const avg = computeAverage(reviews);
    document.getElementById('avgBadge').textContent = `${avg} من 5`;
    document.getElementById('reviewCountText').textContent = `بناءً على ${reviews.length} رأياً للعملاء المعتمدين`;
    document.getElementById('headerStars').innerHTML = starsSVG(Math.round(avg), 18);
  }

  function renderCarousel() {
    const reviews = getReviews();
    const wrapper = document.getElementById('swiperWrapper');
    wrapper.innerHTML = reviews.map(r => `
      <div class="swiper-slide">
        <div class="review-card">
          <div class="card-head">
            <img class="avatar" src="${escapeHTML(r.avatar || 'https://images.unsplash.com/photo-1633332755192-727a05c4013d?w=150')}" alt="${escapeHTML(r.name)}">
            <div class="who">
              <span class="name">${escapeHTML(r.name)}</span>
              ${r.is_verified ? checkmarkBadge() : ''}
            </div>
          </div>
          <div class="stars-row">${starsSVG(r.stars, 16)}</div>
          <div class="title">${escapeHTML(r.title)}</div>
          <div class="body">${escapeHTML(r.body)}</div>
          
          <div class="replies-list">
            ${(r.replies || []).map(rp => `
              <div class="reply-item ${rp.isAdmin ? 'admin-type' : 'user-type'}">
                <div class="reply-header">
                  ${rp.avatar ? `<img src="${escapeHTML(rp.avatar)}" alt="">` : ''}
                  <span>${escapeHTML(rp.name)}</span>
                </div>
                <div>${escapeHTML(rp.text)}</div>
              </div>
            `).join('')}
          </div>

          <button class="reply-btn" onclick="toggleCustomerReply(${r.id})">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            رد
          </button>
          
          <div class="customer-reply-form" id="reply-form-${r.id}">
            <input type="text" placeholder="اكتب ردك..." id="reply-input-${r.id}">
            <button class="btn btn-primary" style="padding:0.35rem 0.75rem; font-size:0.8rem; align-self: flex-start;" onclick="sendCustomerReply(${r.id})">إرسال الرد</button>
          </div>

          <div class="footer">${escapeHTML(r.date)}</div>
        </div>
      </div>
    `).join('');

    if (swiperInstance) swiperInstance.destroy(true, true);
    
    swiperInstance = new Swiper('.review-swiper', {
      slidesPerView: 1,
      spaceBetween: 20,
      loop: false,
      observer: true,
      observeParents: true,
      pagination: { el: '.swiper-pagination', clickable: true },
      navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
      breakpoints: {
        640: { slidesPerView: 2, spaceBetween: 20 },
        1024: { slidesPerView: 3, spaceBetween: 24 }
      }
    });
  }

  function toggleCustomerReply(id) {
    const el = document.getElementById(`reply-form-${id}`);
    if (el) el.classList.toggle('show');
  }

  function sendCustomerReply(id) {
    const input = document.getElementById(`reply-input-${id}`);
    if (!input.value.trim()) return;
    input.value = '';
    document.getElementById(`reply-form-${id}`).classList.remove('show');
    showToast("تم إرسال ردك للمراجعة بنجاح.");
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    document.getElementById('toastMessage').textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3500);
  }

  function renderStarPicker() {
    const picker = document.getElementById('starPicker');
    function draw() {
      picker.innerHTML = '';
      for (let i = 1; i <= 5; i++) {
        const filled = i <= selectedStars;
        const wrapper = document.createElement('span');
        wrapper.style.cursor = 'pointer';
        wrapper.innerHTML = `<svg width="28" height="28" viewBox="0 0 24 24" fill="${filled ? '#4E9FE5' : '#E2E8F0'}" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/>
        </svg>`;
        wrapper.addEventListener('click', () => { selectedStars = i; draw(); });
        picker.appendChild(wrapper);
      }
    }
    draw();
  }

  document.getElementById('openModalBtn').addEventListener('click', () => {
    selectedStars = 5;
    renderStarPicker();
    document.getElementById('reviewForm').reset();
    document.getElementById('modalOverlay').classList.add('show');
  });

  document.getElementById('closeModalBtn').addEventListener('click', () => {
    document.getElementById('modalOverlay').classList.remove('show');
  });

  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'modalOverlay') document.getElementById('modalOverlay').classList.remove('show');
  });

  document.getElementById('reviewForm').addEventListener('submit', function (e) {
    e.preventDefault();
    this.reset();
    document.getElementById('modalOverlay').classList.remove('show');
    showToast("شكراً لك! تم استلام تقييمك بنجاح.");
  });

  window.addEventListener('storage', (e) => {
    if (e.key === STORAGE_KEY) {
      renderHeader();
      renderCarousel();
    }
  });

  renderHeader();
  renderCarousel();
</script>
</body>
</html>
