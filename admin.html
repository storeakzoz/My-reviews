<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKZOZ STORE - لوحة التحكم</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap">
<style>
  :root {
    --brand: #4E9FE5;
    --brand-dark: #2563EB;
    --brand-light: #EFF6FF;
    --brand-border: #BFDBFE;
    --text-dark: #0F172A;
    --text-body: #334155;
    --text-muted: #64748B;
    --border: #E2E8F0;
    --radius-md: 8px;
    --radius-lg: 12px;
  }

  * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
  body { background-color: #F8FAFC; color: var(--text-body); margin: 0; padding: 0; direction: rtl; }

  .admin-wrap { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  .admin-head { margin-bottom: 2rem; }
  .admin-head h1 { margin: 0; font-size: 1.5rem; font-weight: 800; color: var(--text-dark); }
  
  .add-review-section {
    background: #fff; border: 1.5px solid var(--brand-border);
    border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 2.5rem;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
  }

  .admin-card {
    background: #fff; border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1.5rem;
    display: flex; flex-direction: column; gap: 0.75rem;
  }

  .add-reply-box {
    background: #F8FAFC; border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 1rem; margin-top: 0.5rem;
    display: flex; flex-direction: column; gap: 0.6rem;
  }

  input, select, textarea {
    padding: 0.65rem 0.85rem; border: 1px solid var(--border);
    border-radius: var(--radius-md); font-size: 0.88rem; outline: none;
    width: 100%;
  }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0.6rem 1.2rem; font-weight: 700; border-radius: var(--radius-md);
    border: none; cursor: pointer; font-size: 0.88rem;
  }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-danger { background: #EF4444; color: #fff; }

  .replies-list { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem; }
  .reply-item { padding: 0.6rem 0.8rem; border-radius: var(--radius-md); font-size: 0.85rem; }
  .reply-item.admin-type { background: var(--brand-light); border-right: 3px solid var(--brand-dark); }
  .reply-item.user-type { background: #F1F5F9; border-right: 3px solid #94A3B8; }

  .admin-badge {
    background: var(--brand-dark); color: #fff; font-size: 0.65rem;
    padding: 0.1rem 0.4rem; border-radius: 4px; margin-right: 0.4rem;
  }
  .verified-badge { font-size: 0.75rem; color: #059669; background: #ECFDF5; padding: 0.1rem 0.4rem; border-radius: 4px; }

  @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="admin-wrap">
  <div class="admin-head">
    <h1>لوحة التحكم - إدارة التقييمات والردود</h1>
  </div>

  <div class="add-review-section">
    <h3 style="margin:0 0 1rem;font-size:1.1rem;">إضافة تقييم جديد يدويًا</h3>
    <form id="adminNewReviewForm" style="display:flex;flex-direction:column;gap:1rem;">
      <div class="form-grid">
        <input type="text" id="newRevName" placeholder="اسم الزبون" required>
        <input type="text" id="newRevTitle" placeholder="عنوان التقييم" required>
      </div>
      <div class="form-grid">
        <select id="newRevStars">
          <option value="5">5 نجوم</option>
          <option value="4">4 نجوم</option>
          <option value="3">3 نجوم</option>
          <option value="2">نجتان</option>
          <option value="1">نجمة واحدة</option>
        </select>
        <label style="font-size:0.88rem;display:flex;align-items:center;gap:0.4rem;cursor:pointer;">
          <input type="checkbox" id="newRevVerified" checked style="width:auto;"> مشتري موثوق
        </label>
      </div>
      <textarea id="newRevBody" placeholder="نص التقييم..." required rows="3"></textarea>
      <button type="submit" class="btn btn-primary" style="align-self:flex-start;">إضافة التقييم للموقع</button>
    </form>
  </div>

  <h3 style="margin:0 0 1rem;font-size:1.1rem;">قائمة التقييمات الحالية والردود الخاصة</h3>
  <div id="reviewsAdminList"></div>
</div>

<script src="common-v1.js"></script>
<script>
  function renderAdminList() {
    const reviews = getReviews();
    const list = document.getElementById('reviewsAdminList');

    if (!reviews || !reviews.length) {
      list.innerHTML = '<p style="text-align:center;color:var(--text-muted);">لا توجد تقييمات حالياً.</p>';
      return;
    }

    list.innerHTML = reviews.map(r => `
      <div class="admin-card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <strong style="font-size:1rem;">${escapeHTML(r.name)}</strong>
          <div>${starsSVG(r.stars, 14)}</div>
        </div>
        <div style="font-weight:700;font-size:0.95rem;">${escapeHTML(r.title)}</div>
        <div style="font-size:0.9rem;">${escapeHTML(r.body)}</div>

        <div class="replies-list">
          ${(r.replies || []).map((rp, idx) => `
            <div class="reply-item ${rp.isAdmin ? 'admin-type' : 'user-type'}" style="display:flex;justify-content:space-between;align-items:center;">
              <div>
                <strong>${escapeHTML(rp.name)}</strong> ${rp.isAdmin ? '<span class="admin-badge">ADMIN</span>' : '<span style="font-size:0.75rem;color:var(--text-muted);">(رد عميل)</span>'}
                <div>${escapeHTML(rp.text)}</div>
              </div>
              <button class="btn btn-danger" style="padding:0.2rem 0.5rem;font-size:0.75rem;" onclick="deleteReply(${r.id}, ${idx})">حذف الرد</button>
            </div>
          `).join('')}
        </div>

        <div class="add-reply-box">
          <strong style="font-size:0.85rem;">أضف رداً على هذا التقييم:</strong>
          <input type="text" id="reply-text-${r.id}" placeholder="اكتب رد الأدمن الرسمي هنا...">
          <div style="display:flex;gap:0.5rem;margin-top:0.3rem;">
            <button class="btn btn-primary" onclick="addAdminReply(${r.id})">نشر الرد رسمياً</button>
            <button class="btn btn-danger" onclick="deleteReview(${r.id})">حذف التقييم كاملاً</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  document.getElementById('adminNewReviewForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const reviews = getReviews();
    reviews.unshift({
      id: Date.now(),
      name: document.getElementById('newRevName').value.trim(),
      stars: parseInt(document.getElementById('newRevStars').value, 10),
      title: document.getElementById('newRevTitle').value.trim(),
      body: document.getElementById('newRevBody').value.trim(),
      date: new Date().toISOString().split('T')[0],
      is_verified: document.getElementById('newRevVerified').checked,
      avatar: DEFAULT_AVATAR,
      replies: []
    });

    saveReviews(reviews);
    this.reset();
    renderAdminList();
    alert("تمت إضافة التقييم بنجاح إلى المتجر.");
  });

  function addAdminReply(id) {
    const textInput = document.getElementById(`reply-text-${id}`);
    const text = textInput.value.trim();
    if (!text) return;

    const reviews = getReviews();
    const review = reviews.find(r => r.id === id);
    if (review) {
      if (!review.replies) review.replies = [];
      review.replies.push({
        id: Date.now(),
        name: 'AKZOZ STORE',
        avatar: '',
        text: text,
        isAdmin: true
      });
      saveReviews(reviews);
      renderAdminList();
      alert("تم نشر الرد الرسمي.");
    }
  }

  function deleteReply(reviewId, replyIndex) {
    const reviews = getReviews();
    const review = reviews.find(r => r.id === reviewId);
    if (review && review.replies) {
      review.replies.splice(replyIndex, 1);
      saveReviews(reviews);
      renderAdminList();
    }
  }

  function deleteReview(id) {
    if (confirm('هل أنت متأكد من حذف هذا التقييم؟')) {
      let reviews = getReviews();
      reviews = reviews.filter(r => r.id !== id);
      saveReviews(reviews);
      renderAdminList();
    }
  }

  renderAdminList();
</script>
</body>
</html>
