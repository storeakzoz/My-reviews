<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم بالتقييمات</title>
<link rel="stylesheet" href="styles.css">
<style>
  .admin-wrap {
    max-width: 950px;
    margin: 0 auto;
    padding: 3rem 1.5rem 5rem;
    display: none;
  }
  .admin-wrap.visible { display: block; }

  .admin-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2rem;
  }

  .panel {
    background: var(--card-bg);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-subtle);
    border: 1px solid var(--border);
    padding: 2rem;
    margin-bottom: 2rem;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.2rem;
  }
  @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }

  .review-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem 0;
    border-bottom: 1px solid var(--border);
  }
  .review-row:last-child { border-bottom: none; }

  .review-row .thumb {
    width: 44px; height: 44px;
    border-radius: 50%;
    object-fit: cover;
  }

  .gate {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .gate-box {
    background: var(--card-bg);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-pop);
    padding: 2.5rem;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-box">
    <h2 style="font-size:1.3rem;font-weight:800;margin:0 0 0.5rem;">دخول لوحة التحكم</h2>
    <p style="color:var(--text-muted);font-size:0.88rem;margin:0 0 1.5rem;">أدخل رمز المرور للتحكم بالتقييمات</p>
    <form id="gateForm">
      <input type="password" id="passInput" placeholder="••••••••" style="text-align:center;font-size:1.1rem;margin-bottom:1rem;" required>
      <p id="gateError" style="color:var(--danger);font-size:0.82rem;display:none;margin-bottom:0.8rem;">رمز المرور خاطئ</p>
      <button type="submit" class="btn btn-primary" style="width:100%;">دخول</button>
    </form>
  </div>
</div>

<div class="admin-wrap" id="adminWrap">
  <div class="admin-header">
    <h1 style="font-size:1.5rem;font-weight:800;margin:0;">إدارة آراء العملاء</h1>
    <a href="index.html" target="_blank" class="btn btn-ghost" style="padding:0.5rem 1rem;">معاينة الموقع ↗</a>
  </div>

  <div class="panel">
    <h2 style="font-size:1.15rem;font-weight:800;margin:0 0 1.5rem;">إضافة تقييم جديد</h2>
    <form id="addForm">
      <div class="grid-2">
        <div class="field">
          <label>اسم العميل</label>
          <input type="text" id="aName" required placeholder="مثال: خالد الدوسري">
        </div>
        <div class="field">
          <label>رابط الصورة (اختياري)</label>
          <input type="text" id="aAvatar" placeholder="https://...">
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>عدد النجوم</label>
          <select id="aStars">
            <option value="5">5 نجوم</option>
            <option value="4">4 نجوم</option>
            <option value="3">3 نجوم</option>
          </select>
        </div>
        <div class="field">
          <label>التاريخ</label>
          <input type="text" id="aDate" value="اليوم">
        </div>
      </div>

      <div class="field">
        <label>عنوان التقييم</label>
        <input type="text" id="aTitle" required placeholder="عنوان مختصر">
      </div>

      <div class="field">
        <label>نص التقييم</label>
        <textarea id="aBody" required placeholder="نص التقييم كامل..."></textarea>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;">نشر التقييم فوراً</button>
    </form>
  </div>

  <div class="panel">
    <h2 style="font-size:1.15rem;font-weight:800;margin:0 0 1rem;">التقييمات الحالية</h2>
    <div id="reviewsList"></div>
  </div>
</div>

<script src="common.js"></script>
<script>
  document.getElementById('gateForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (document.getElementById('passInput').value === getAdminPass()) {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('adminWrap').classList.add('visible');
      renderList();
    } else {
      document.getElementById('gateError').style.display = 'block';
    }
  });

  function renderList() {
    const reviews = getReviews();
    const container = document.getElementById('reviewsList');
    if (!reviews.length) {
      container.innerHTML = '<p style="color:var(--text-muted);text-align:center;">لا توجد تقييمات</p>';
      return;
    }
    container.innerHTML = reviews.map(r => `
      <div class="review-row">
        <img class="thumb" src="${escapeHTML(r.avatar)}" alt="${escapeHTML(r.name)}">
        <div style="flex:1;">
          <div style="font-weight:700;font-size:0.9rem;">${escapeHTML(r.name)} (${r.stars} نجوم)</div>
          <div style="color:var(--text-muted);font-size:0.82rem;">${escapeHTML(r.title)}</div>
        </div>
        <button class="btn btn-danger" onclick="removeReview('${r.id}')">حذف</button>
      </div>
    `).join('');
  }

  function removeReview(id) {
    if (confirm('هل أنت متأكد من الحذف؟')) {
      deleteReview(id);
      renderList();
    }
  }

  document.getElementById('addForm').addEventListener('submit', function (e) {
    e.preventDefault();
    addReview({
      name: document.getElementById('aName').value.trim(),
      avatar: document.getElementById('aAvatar').value.trim() || 'https://images.unsplash.com/photo-1633332755192-727a05c4013d?w=150',
      is_verified: true,
      stars: Number(document.getElementById('aStars').value),
      title: document.getElementById('aTitle').value.trim(),
      body: document.getElementById('aBody').value.trim(),
      date: document.getElementById('aDate').value.trim() || 'اليوم'
    });
    this.reset();
    document.getElementById('aDate').value = 'اليوم';
    renderList();
  });
</script>
</body>
</html>
